services:
  model-cache-init:
    image: company/open-webui:${OPEN_WEBUI_IMAGE_TAG:-prod}
    pull_policy: never
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cp -a /app/backend/data/. /target/
        mkdir -p /target/cache/embedding/local/all-MiniLM-L6-v2
        cp -aL /app/backend/data/cache/embedding/models/models--sentence-transformers--all-MiniLM-L6-v2/snapshots/*/. /target/cache/embedding/local/all-MiniLM-L6-v2/
    restart: "no"
    volumes:
      - open-webui:/target

  open-webui:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        OPEN_WEBUI_NODE_IMAGE: ${OPEN_WEBUI_NODE_IMAGE:-m.daocloud.io/docker.io/library/node:22-alpine3.20}
        OPEN_WEBUI_PYTHON_IMAGE: ${OPEN_WEBUI_PYTHON_IMAGE:-m.daocloud.io/docker.io/library/python:3.11-slim-bookworm}
    image: company/open-webui:${OPEN_WEBUI_IMAGE_TAG:-prod}
    pull_policy: build
    depends_on:
      model-cache-init:
        condition: service_completed_successfully
    env_file:
      - path: ${OPEN_WEBUI_ENV_FILE:-.env}
        required: true
    ports:
      - ${OPEN_WEBUI_PORT:-3000}:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    volumes:
      - open-webui:/app/backend/data

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: ${OPEN_WEBUI_SUBNET:-192.168.30.0/24}

volumes:
  open-webui: {}
